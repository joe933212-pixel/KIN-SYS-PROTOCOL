name: Protocol conformance slice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "protocol-reference/**"
      - "scripts/prototype_smoke_test.py"
      - "docs/TRANSITION_CONTRACT.md"
      - ".github/workflows/protocol-conformance.yml"
  pull_request:
    paths:
      - "protocol-reference/**"
      - "scripts/prototype_smoke_test.py"
      - "docs/TRANSITION_CONTRACT.md"
      - ".github/workflows/protocol-conformance.yml"

permissions:
  contents: read

jobs:
  local-transition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kin_sys
          POSTGRES_PASSWORD: kin_sys_test
          POSTGRES_DB: kin_sys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kin_sys -d kin_sys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KIN_SYS_POSTGRES_TEST_DSN: postgresql://kin_sys:kin_sys_test@localhost:5432/kin_sys_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vetted federation crypto dependency
        run: python -m pip install --disable-pip-version-check -r protocol-reference/requirements-trust.txt
      - name: Install vetted OIDC identity dependency
        run: python -m pip install --disable-pip-version-check -r protocol-reference/requirements-identity.txt
      - name: Install PostgreSQL test driver
        run: python -m pip install --disable-pip-version-check -r protocol-reference/requirements-postgresql.txt
      - name: Run transition contract tests
        run: python -m unittest discover -s protocol-reference/tests -v
      - name: Smoke-test the runnable local HTTP prototype
        run: python scripts/prototype_smoke_test.py
      - name: Generate paired comparison report
        run: PYTHONPATH=protocol-reference python -m comparators.paired_harness > comparison-results.json
      - name: Verify paired comparison report
        run: python -c "import json; r=json.load(open('comparison-results.json', encoding='utf-8')); assert r['all_equivalent_on_observed_fields'], r"
      - name: Generate integrated demonstrator report
        run: PYTHONPATH=protocol-reference python -m integrated_demo > integrated-demo-results.json
      - name: Verify integrated demonstrator report
        run: python -c "import json; r=json.load(open('integrated-demo-results.json', encoding='utf-8')); assert r['status'] == 'DEMO_READY_AFTER_SIMULATED_REMITTANCE', r; assert r['payment']['funds_moved'] is False, r; assert r['payment_lifecycle']['status'] == 'SIMULATED_SETTLED', r; assert r['payment_lifecycle']['recorded_status'] == 'SETTLED', r; assert r['payment_lifecycle']['funds_moved'] is False, r; assert r['minah_advisory']['may_authorise'] is False, r"
      - name: Generate paired integrated workflow report
        run: PYTHONPATH=protocol-reference python -m comparators.paired_integrated_harness > paired-integrated-results.json
      - name: Verify paired integrated workflow report
        run: python -c "import json; r=json.load(open('paired-integrated-results.json', encoding='utf-8')); assert r['all_equivalent_on_observed_fields'], r"
      - name: Upload reproducible research reports
        uses: actions/upload-artifact@v4
        with:
          name: protocol-and-integrated-demo-results
          path: |
            comparison-results.json
            integrated-demo-results.json
            paired-integrated-results.json
          if-no-files-found: error
          retention-days: 30
