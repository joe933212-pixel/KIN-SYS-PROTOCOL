name: Protocol conformance slice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "protocol-reference/**"
      - "docs/TRANSITION_CONTRACT.md"
      - ".github/workflows/protocol-conformance.yml"
  pull_request:
    paths:
      - "protocol-reference/**"
      - "docs/TRANSITION_CONTRACT.md"
      - ".github/workflows/protocol-conformance.yml"

permissions:
  contents: read

jobs:
  local-transition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run transition contract tests
        run: python -m unittest discover -s protocol-reference/tests -v
      - name: Generate paired comparison report
        run: PYTHONPATH=protocol-reference python -m comparators.paired_harness > comparison-results.json
      - name: Verify paired comparison report
        run: python -c "import json; r=json.load(open('comparison-results.json', encoding='utf-8')); assert r['all_equivalent_on_observed_fields'], r"
      - name: Generate integrated demonstrator report
        run: PYTHONPATH=protocol-reference python -m integrated_demo > integrated-demo-results.json
      - name: Verify integrated demonstrator report
        run: python -c "import json; r=json.load(open('integrated-demo-results.json', encoding='utf-8')); assert r['status'] == 'DEMO_READY_AFTER_SIMULATED_REMITTANCE', r; assert r['payment']['funds_moved'] is False, r; assert r['minah_advisory']['may_authorise'] is False, r"
      - name: Upload reproducible research reports
        uses: actions/upload-artifact@v4
        with:
          name: protocol-and-integrated-demo-results
          path: |
            comparison-results.json
            integrated-demo-results.json
          if-no-files-found: error
          retention-days: 30
